name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify build assets exist
        run: node scripts/verify_assets.mjs

      - name: Deploy Pages project (static + Functions)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=forgehouse50

      # Schema is idempotent (CREATE TABLE IF NOT EXISTS / INSERT OR IGNORE)
      - name: Apply D1 schema (idempotent)
        run: |
          npx --yes wrangler d1 execute forgehouse50-db --remote --file=schema.sql --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright
          npx --yes playwright install chromium --with-deps

      - name: Post-deploy smoke test
        run: node scripts/smoke_test.mjs
        env:
          TEST_URL: https://forgehouse50.pages.dev
