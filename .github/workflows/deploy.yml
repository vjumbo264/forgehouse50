name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Pages project (static + Functions)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=forgehouse50

      # Schema is idempotent (CREATE TABLE IF NOT EXISTS / INSERT OR IGNORE),
      # so applying it on every deploy is safe and keeps D1 in sync.
      - name: Apply D1 schema (idempotent)
        run: |
          npx wrangler@latest d1 execute forgehouse50-db --remote --file=schema.sql --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
