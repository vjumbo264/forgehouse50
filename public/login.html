<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ForgeHouse 50 — Log in</title>
<link rel="stylesheet" href="/app.v12.css">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0f1216">
<link rel="icon" href="/icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ForgeHouse 50">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<style>body{padding-bottom:0}</style>
</head>
<body>
<div class="wrap" style="max-width:440px;padding-top:48px">
  <div class="center" style="margin-bottom:22px">
    <div class="brand" style="font-size:26px">ForgeHouse <span>50</span></div>
    <div class="tagline">Read the New Testament in 50 Reading Days</div>
  </div>
  <div class="card">
    <h1 style="margin-top:0">Welcome back</h1>
    <form id="f">
      <label>Email</label>
      <input type="text" id="email" required autocomplete="email" placeholder="you@example.com">
      <div id="admin-hint" style="display:none;margin-top:6px;padding:8px 10px;background:rgba(217,119,6,0.15);border:1px solid rgba(217,119,6,0.3);border-radius:6px;font-size:13px;color:#fbbf24">
        Looks like an admin username. <a id="admin-hint-link" href="/admin-login.html" style="color:#f59e0b;font-weight:600;text-decoration:underline">Use Admin sign in →</a>
      </div>
      <label style="margin-top:12px">Password</label>
      <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
      <div class="error" id="err"></div>
      <button class="btn" type="submit" style="margin-top:16px">Log in</button>
    </form>
    <p class="small muted center" style="margin:14px 0 0">New here? <a href="/signup">Create an account</a></p>
    <div style="margin-top:20px;padding-top:16px;border-top:1px solid rgba(255,255,255,0.08);text-align:center">
      <a href="/admin-login.html" class="btn ghost small" style="display:inline-block;width:100%;box-sizing:border-box">Admin sign in</a>
    </div>
  </div>
</div>
<script src="/app.v7.js"></script>
<script>
const emailInput = document.getElementById('email');
const adminHint = document.getElementById('admin-hint');
const adminHintLink = document.getElementById('admin-hint-link');

function checkAdminUsername(val) {
  const v = val.trim();
  if (v.length > 2 && !v.includes('@')) {
    adminHint.style.display = 'block';
    adminHintLink.href = '/admin-login.html?username=' + encodeURIComponent(v);
  } else {
    adminHint.style.display = 'none';
  }
}

emailInput.addEventListener('input', () => checkAdminUsername(emailInput.value));

document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const emailVal = emailInput.value.trim();
  const err = document.getElementById('err'); err.textContent = '';
  if (!emailVal.includes('@')) {
    checkAdminUsername(emailVal);
    err.textContent = "Email must contain '@'. If you are an admin, use Admin sign in below.";
    return;
  }
  const btn = e.target.querySelector('button[type="submit"]'); btn.disabled = true;
  const { ok, data } = await FH.api('/api/auth/login', { method: 'POST', body: {
    email: emailVal, password: document.getElementById('password').value } });
  btn.disabled = false;
  if (ok) { location.href = '/'; return; }
  if (data?.needs_verification) { location.href = '/verify?email=' + encodeURIComponent(data.email); return; }
  err.textContent = data?.error || 'Login failed';
});
</script>
</body>
</html>
