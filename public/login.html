<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ForgeHouse 50 — Log in</title>
<link rel="stylesheet" href="/app.css">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0f1216">
<link rel="icon" href="/icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ForgeHouse 50">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<style>body{padding-bottom:0}</style>
</head>
<body>
<div class="wrap" style="max-width:440px;padding-top:48px">
  <div class="center" style="margin-bottom:22px">
    <div class="brand" style="font-size:26px">ForgeHouse <span>50</span></div>
    <div class="tagline">Read the New Testament in 50 Reading Days</div>
  </div>
  <div class="card">
    <h1 style="margin-top:0">Welcome back</h1>
    <form id="f">
      <label>Email</label>
      <input type="email" id="email" required autocomplete="email" placeholder="you@example.com">
      <label>Password</label>
      <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
      <div class="error" id="err"></div>
      <button class="btn" type="submit">Log in</button>
    </form>
    <p class="small muted center" style="margin:14px 0 0">New here? <a href="/signup.html">Create an account</a></p>
  </div>
</div>
<script src="/app.js"></script>
<script>
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('err'); err.textContent = '';
  const btn = e.target.querySelector('button'); btn.disabled = true;
  const { ok, data } = await FH.api('/api/auth/login', { method: 'POST', body: {
    email: document.getElementById('email').value, password: document.getElementById('password').value } });
  btn.disabled = false;
  if (ok) { location.href = '/'; return; }
  if (data?.needs_verification) { location.href = '/verify.html?email=' + encodeURIComponent(data.email); return; }
  err.textContent = data?.error || 'Login failed';
});
</script>
</body>
</html>
