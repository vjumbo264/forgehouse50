<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ForgeHouse 50 — Log in</title>
<link rel="stylesheet" href="/app.css">
<link rel="manifest" href="/manifest.webmanifest">
<!-- Theme is automatic (prefers-color-scheme). This tag is only the browser-chrome
     colour and is kept in sync by FH.initTheme(); there is no theme setting. -->
<meta name="theme-color" content="#f4f7fc">
<link rel="icon" href="/icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ForgeHouse 50">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
</head>
<body class="auth">
<main class="auth-wrap">
  <div id="head"></div>
  <section class="auth-card rise">
    <h1 style="margin-bottom:var(--s-2)">Welcome back</h1>
    <p class="small muted" style="margin-bottom:var(--s-5)">
      Pick up where you left off in the New Testament.</p>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email"
               inputmode="email" autocapitalize="off" spellcheck="false"
               placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required
               autocomplete="current-password" placeholder="••••••••">
      </div>
      <div class="error" id="err" role="alert"></div>
      <button class="btn" type="submit" id="submit-btn">Log in</button>
    </form>

    <p class="auth-foot">New here? <a href="/signup.html">Create an account</a></p>
  </section>
</main>
<script src="/app.js"></script>
<script src="/js/login.js"></script>
<script src="https://www.genspark.ai/sandbox_inspect.js"></script></body>
</html>
