<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ForgeHouse 50 — Read</title>
<link rel="stylesheet" href="/app.css">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#f4f7fc">
<link rel="icon" href="/icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ForgeHouse 50">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
</head>
<body>
<div class="wrap">
  <div id="top"></div>
  <main>
    <section id="day-head" aria-label="Reading day"></section>

    <section class="reader-tools" aria-label="Reading controls">
      <div class="group">
        <button class="iconbtn" id="fs-dec" title="Smaller text" aria-label="Decrease text size">A−</button>
        <button class="iconbtn" id="fs-inc" title="Larger text" aria-label="Increase text size">A+</button>
      </div>
      <div class="group" style="flex:1;min-width:0">
        <label for="translation" class="sr-only">Translation</label>
        <select id="translation" class="input-sm" style="flex:1"></select>
      </div>
      <button class="iconbtn" id="bookmark-btn" title="Bookmark this passage" aria-label="Bookmark this passage"></button>
    </section>

    <article id="passage" class="reader scripture fs-medium" aria-live="polite">
      <div class="skeleton line"></div><div class="skeleton line w60"></div>
      <div class="skeleton line"></div><div class="skeleton line w40"></div>
    </article>

    <section class="audio" id="audio-card" aria-label="Audio narration">
      <div class="audio-head">
        <span class="label" id="audio-label">Audio</span>
        <span class="small muted" id="audio-note">Checking availability…</span>
      </div>
      <div class="audio-main">
        <button class="audio-play" id="audio-play" disabled aria-label="Play narration">▶</button>
        <div class="bar thin" style="flex:1"><i id="audio-bar"></i></div>
      </div>
      <div class="audio-chips" id="audio-chapters" style="display:none"></div>
      <button class="btn soft small" id="audio-done" style="display:none">Mark audio complete</button>
    </section>

    <section id="mark-area"></section>
    <p class="attribution" id="attrib"></p>
  </main>
</div>
<script src="/app.js"></script>
<script>FH.nav('read');</script>
<script src="/js/read.js"></script>
<script src="https://www.genspark.ai/sandbox_inspect.js"></script></body>
</html>
