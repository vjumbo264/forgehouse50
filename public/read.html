<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ForgeHouse 50 — Read</title>
<link rel="stylesheet" href="/app.v10.css">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0f1216">
<link rel="icon" href="/icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ForgeHouse 50">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
</head>
<body class="read-page">
<div class="wrap read-wrap">
  <!-- Compact header is rendered by the script into #top (two slim rows).
       The old brand topbar / day heading / toolbar stack is gone from this
       page only; other pages keep FH.topbar(). -->
  <div id="top"></div>
  <div id="overflow-menu" hidden></div>
  <div id="passage-wrap">
    <div id="passage" class="card scripture fs-medium reader-pane"><p class="muted">Loading passage…</p></div>
    <button id="autoscroll-resume" hidden>Resume auto-scroll</button>
  </div>
  <div class="reader-nav" id="chapter-nav" style="display:none">
    <button class="btn ghost small" id="ch-prev" style="width:auto">Previous chapter</button>
    <span class="small muted" id="ch-label"></span>
    <button class="btn ghost small" id="ch-next" style="width:auto">Next chapter</button>
  </div>
  <!-- Mark-complete / write-a-note live as a slim strip between the chapter
       nav and the player, never as a stacked card. -->
  <div id="mark-area"></div>
  <!-- Audio player is the LAST element above the fixed bottom nav. -->
  <div class="card flat" id="audio-card">
    <div class="ac-row ac-status">
      <span id="audio-note" class="small muted">Checking availability…</span>
      <button class="iconbtn small" id="audio-done" style="display:none" title="Mark audio complete" aria-label="Mark audio complete"></button>
      <button class="iconbtn small" id="dl-toggle" style="display:none" title="Download audio" aria-label="Download audio" aria-haspopup="menu"></button>
    </div>
    <div id="dl-menu" hidden>
      <button class="btn ghost small" id="audio-dl">Download this chapter</button>
      <button class="btn ghost small" id="audio-dl-all">Download all for today</button>
    </div>
    <div class="ac-row ac-controls">
      <button class="iconbtn" id="audio-back" disabled title="Back 5 seconds" aria-label="Back 5 seconds"></button>
      <button id="audio-play" disabled aria-label="Play"></button>
      <button class="iconbtn" id="audio-fwd" disabled title="Forward 5 seconds" aria-label="Forward 5 seconds"></button>
      <span class="small muted" id="audio-cur">0:00</span>
      <input type="range" id="audio-seek" min="0" max="1000" value="0" step="1" disabled aria-label="Seek narration">
      <span class="small muted" id="audio-dur">0:00</span>
    </div>
    <div style="display:none" id="audio-chapters" aria-label="Choose chapter"></div>
  </div>
  <!-- Hidden holders: #day-head kept so legacy fills are inert; #attrib holds
       the scripture attribution text which surfaces via the header overflow menu. -->
  <div id="day-head" hidden></div>
  <div class="card flat small muted" id="attrib" hidden></div>
</div>
<script src="/app.v7.js"></script>
<script>
(async () => {
  const me = await FH.requireAuth();
  if (!me) return;
  // Compact two-row header (reading_page_compaction_v1 task-i03): brand +
  // day pill + overflow menu on row 1; assignment title + meta on row 2.
  // The overflow menu absorbs translation, text size, bookmark, day-to-day
  // navigation and the scripture-source attribution — everything that used
  // to be stacked blocks adding ~216px above the pane. FH.topbar() is left
  // untouched for the other nine pages.
  document.getElementById('top').innerHTML = `
    <div class="rd-top">
      <div class="rd-brand">ForgeHouse <span>50</span></div>
      <span class="pill" id="rd-day-pill"></span>
      <span style="flex:1"></span>
      <button class="iconbtn small" id="menu-btn" aria-label="Reading options" aria-haspopup="menu"></button>
    </div>
    <div class="rd-sub"><span class="rd-assign" id="rd-assign"></span><span class="rd-meta muted" id="rd-meta"></span></div>`;
  document.getElementById('menu-btn').innerHTML = FH.ICONS.menu;
  document.getElementById('overflow-menu').innerHTML = `
    <label for="translation">Translation</label>
    <select id="translation"></select>
    <div class="row" style="gap:8px">
      <span class="small muted">Text size</span>
      <button class="iconbtn" id="fs-dec" title="Smaller text">A-</button>
      <button class="iconbtn" id="fs-inc" title="Larger text">A+</button>
      <button class="iconbtn" id="bookmark-btn" title="Bookmark this passage" aria-label="Bookmark this passage"></button>
    </div>
    <div id="om-day-nav" class="om-nav"></div>
    <div class="small muted" id="om-attrib"></div>`;
  const om = document.getElementById('overflow-menu');
  document.getElementById('menu-btn').onclick = (e) => { e.stopPropagation(); om.hidden = !om.hidden; };
  document.addEventListener('click', (e) => {
    if (!om.hidden && !om.contains(e.target)) om.hidden = true;
  });

  const params = new URLSearchParams(location.search);
  const dayN = parseInt(params.get('day') || '1', 10);

  // Load day + translations
  const [{ data: day }, { data: tr }] = await Promise.all([
    FH.api('/api/read/day?n=' + dayN), FH.api('/api/translations')]);
  if (!day) { document.getElementById('passage').innerHTML = '<p class="error">Could not load this reading day.</p>'; return; }

  const assignText = day.assignments.map(a =>
    a.chapter_start === a.chapter_end ? `${a.book} ${a.chapter_start}` : `${a.book} ${a.chapter_start}–${a.chapter_end}`).join(' · ');
  // Fill the compact header (no stacked day heading block any more).
  document.getElementById('rd-day-pill').textContent = `Day ${day.day_number}`;
  document.getElementById('rd-assign').textContent = assignText;
  document.getElementById('rd-assign').title = assignText;
  document.getElementById('rd-meta').textContent = `${day.chapter_count} ch · ~${day.est_minutes} min`;
  // Day-to-day navigation lives in the header overflow menu, not page flow.
  document.getElementById('om-day-nav').innerHTML = `
    ${dayN > 1 ? `<a class="btn ghost small" href="/read?day=${dayN - 1}">Previous · Day ${dayN - 1}</a>` : ''}
    ${dayN < 50 ? `<a class="btn ghost small" href="/read?day=${dayN + 1}">Next · Day ${dayN + 1}</a>` : ''}`;

  const sel = document.getElementById('translation');
  const trList = tr?.translations || [];
  sel.innerHTML = trList.map(t => `<option value="${FH.esc(t.id)}">${FH.esc(t.name)}</option>`).join('');
  // The selector lists ONLY translations actually available from VerseWell
  // (the mock translation was removed in task-p04). Prefer a sensible live
  // default (CEV first — reads naturally aloud and has intros+footnotes),
  // then any live version. Remember the user's last pick.
  const savedTr = localStorage.getItem('fh50_translation');
  const ids = trList.map(t => t.id);
  const defaultTr = (savedTr && ids.includes(savedTr)) ? savedTr
    : (ids.find(i => i === 'versewell-cev') || ids.find(i => i.startsWith('versewell-')) || ids[0]);
  if (defaultTr) sel.value = defaultTr;
  if (!trList.length || tr?.versewell_live === false) {
    // VerseWell mirror unreachable right now — say so plainly.
    document.getElementById('passage').innerHTML =
      '<p class="muted">Scripture is temporarily unavailable. Please try again shortly.</p>';
    document.getElementById('attrib').textContent = '';
    sel.disabled = true;
    return;
  }

  let currentParts = [];

  // Load passage text (fetch each assignment range in turn)
  async function loadPassage() {
    const translation = sel.value;
    localStorage.setItem('fh50_translation', translation);
    document.getElementById('passage').innerHTML = '<p class="muted">Loading passage…</p>';
    const parts = [];
    let failed = false;
    for (const a of day.assignments) {
      const { ok, data } = await FH.api(`/api/read/passage?book=${encodeURIComponent(a.book)}&chapter_start=${a.chapter_start}&chapter_end=${a.chapter_end}&translation=${encodeURIComponent(translation)}`);
      // Never swallow a failure silently: if VerseWell is unreachable or a
      // chapter is missing, show a clear unavailable state (no mock fallback).
      if (!ok || !data || !Array.isArray(data.verses) || data.verses.length === 0) { failed = true; break; }
      parts.push(data);
    }
    if (failed) {
      currentParts = [];
      document.getElementById('passage').innerHTML =
        '<p class="muted">Scripture is temporarily unavailable for this passage. Please try again shortly.</p>';
      document.getElementById('attrib').textContent = '';
      loadAudio();
      return;
    }
    currentParts = parts;
    buildChapters(parts);
    renderChapter(0);
    loadAudio(); // re-check audio for the newly selected translation
  }

  let highlights = [];
  async function loadHighlights() {
    const first = day.assignments[0];
    const { data } = await FH.api(`/api/read/highlights?book=${encodeURIComponent(first.book)}&chapter=${first.chapter_start}`);
    highlights = data?.highlights || [];
  }

  function renderIntroBlock(intro) {
    // Visually separated, always-expanded block — never merged into verse text.
    return `<div class="intro-block"><div class="intro-label">Introduction</div><p>${FH.esc(intro.text)}</p></div>`;
  }

  // The day is flattened into an ordered chapter list across all assignment
  // ranges (a day can span multiple books). Exactly ONE chapter renders in
  // the fixed-height .reader-pane at a time; Prev/Next buttons live outside
  // the pane so they are always visible (Part E).
  let chapterList = [];  // [{book, chapter, verses, intros, attribution}]
  let chapterIdx = 0;

  function buildChapters(parts) {
    chapterList = [];
    for (const p of parts) {
      const bookName = p.reference.replace(/\s+\d.*$/, '');
      const intros = Array.isArray(p.intros) ? p.intros : [];
      const byCh = new Map();
      for (const v of p.verses) {
        if (!byCh.has(v.chapter)) byCh.set(v.chapter, []);
        byCh.get(v.chapter).push(v);
      }
      for (const [ch, verses] of byCh)
        chapterList.push({
          book: bookName, chapter: ch, verses,
          intros: intros.filter(i => i.chapter === ch),
          attribution: p.attribution,
        });
    }
  }

  function renderChapter(i) {
    if (!chapterList.length) return;
    chapterIdx = Math.min(Math.max(0, i), chapterList.length - 1);
    const c = chapterList[chapterIdx];
    const cont = document.getElementById('passage');
    if (typeof window.__fhAutoScrollReset === 'function') window.__fhAutoScrollReset();
    let html = `<h3 style="color:var(--accent-text);margin:0 0 10px">${FH.esc(c.book)} ${c.chapter}</h3>`;
    for (const intro of c.intros) html += renderIntroBlock(intro);
    html += c.verses.map(v => {
      const hl = highlights.find(h => h.chapter === v.chapter && v.verse >= h.verse_start && v.verse <= h.verse_end);
      const fn = (v.footnotes && v.footnotes.length)
        ? v.footnotes.map(f =>
            `<button class="fn-marker" data-fn="${FH.esc(f.text)}" title="Footnote">${FH.esc(f.marker)}</button>`).join('')
        : '';
      return `<p class="v ${hl ? 'hl-' + hl.color : ''}" data-book="${FH.esc(c.book)}" data-ch="${v.chapter}" data-v="${v.verse}"><span class="vn">${v.verse}</span>${FH.esc(v.text)}${fn}</p>`;
    }).join('');
    cont.innerHTML = html;
    cont.scrollTop = 0; // new chapter always starts at the top of the pane
    document.getElementById('attrib').textContent = c.attribution || '';
    document.getElementById('om-attrib').textContent = c.attribution || '';
    const nav = document.getElementById('chapter-nav');
    nav.style.display = 'flex';
    document.getElementById('ch-prev').disabled = chapterIdx === 0;
    document.getElementById('ch-next').disabled = chapterIdx === chapterList.length - 1;
    document.getElementById('ch-label').textContent =
      `Chapter ${chapterIdx + 1} of ${chapterList.length}`;
  }
  document.getElementById('ch-prev').onclick = () => renderChapter(chapterIdx - 1);
  document.getElementById('ch-next').onclick = () => renderChapter(chapterIdx + 1);

  // Footnote marker: single tappable marker per footnote; tap toggles an
  // inline expansion directly under the verse (tap again or another to close).
  document.getElementById('passage').addEventListener('click', (e) => {
    const marker = e.target.closest('.fn-marker');
    if (marker) {
      e.stopPropagation();
      const verse = marker.closest('p.v');
      const existing = verse.nextElementSibling;
      const already = existing && existing.classList.contains('fn-pop') && existing.dataset.for === marker.dataset.fn;
      document.querySelectorAll('.fn-pop').forEach(el => el.remove());
      if (!already) {
        const pop = document.createElement('div');
        pop.className = 'fn-pop';
        pop.dataset.for = marker.dataset.fn;
        pop.textContent = marker.dataset.fn;
        verse.after(pop);
      }
      return;
    }
  });

  // ----- Audio (live VerseWell per-chapter files; seek + download) -----
  const audioEl = new Audio();
  let audioQueue = [];   // [{chapter, url}] — chapters of THIS day with real audio
  let audioIdx = -1;
  let seeking = false;
  let pendingSeek = null; // seconds (or 'ratio:0..1') applied once real metadata loads
  const playBtn = document.getElementById('audio-play');
  const backBtn = document.getElementById('audio-back');
  const fwdBtn = document.getElementById('audio-fwd');
  const seekEl = document.getElementById('audio-seek');
  const curEl = document.getElementById('audio-cur');
  const durEl = document.getElementById('audio-dur');
  const noteEl = document.getElementById('audio-note');
  const doneBtn = document.getElementById('audio-done');
  const dlBtn = document.getElementById('audio-dl');
  const dlAllBtn = document.getElementById('audio-dl-all');
  const dlToggle = document.getElementById('dl-toggle');
  const dlMenu = document.getElementById('dl-menu');
  const chapRow = document.getElementById('audio-chapters');

  // Icon glyphs (SVG, no emoji) for the player controls.
  const ICON_PLAY = FH.ICONS.play + '<span>Play</span>';
  const ICON_PAUSE = FH.ICONS.pause + '<span>Pause</span>';
  backBtn.innerHTML = FH.ICONS.back5 + '<span>5s</span>';
  fwdBtn.innerHTML = FH.ICONS.fwd5 + '<span>5s</span>';
  dlBtn.innerHTML = FH.ICONS.download + '<span>Download this chapter</span>';
  dlAllBtn.innerHTML = FH.ICONS.download + '<span>Download all for today</span>';
  dlToggle.innerHTML = FH.ICONS.download;
  doneBtn.innerHTML = FH.ICONS.check + '<span>Mark audio complete</span>';
  document.getElementById('bookmark-btn').innerHTML = FH.ICONS.bookmark;
  playBtn.innerHTML = ICON_PLAY;

  function fmtSecs(s) {
    if (!isFinite(s) || s < 0) s = 0;
    s = Math.floor(s);
    return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  }
  function syncSeekUi() {
    const d = audioEl.duration;
    const v = d && isFinite(d) ? Math.round(1000 * audioEl.currentTime / d) : 0;
    if (!seeking) seekEl.value = v;
    // Filled accent portion of the scrubber track (see app.v10.css gradient).
    seekEl.style.setProperty('--fill', (v / 10) + '%');
    curEl.textContent = fmtSecs(audioEl.currentTime);
    durEl.textContent = fmtSecs(d);
  }

  function setAudioState() {
    const has = audioQueue.length > 0;
    for (const b of [playBtn, backBtn, fwdBtn]) b.disabled = !has;
    seekEl.disabled = !has;
    if (has) {
      noteEl.textContent = `${audioQueue.length} chapter${audioQueue.length > 1 ? 's' : ''} narrated (VerseWell)`;
      chapRow.style.display = audioQueue.length > 1 ? 'inline-flex' : 'none';
      chapRow.innerHTML = audioQueue.map((a, i) =>
        `<button type="button" data-ai="${i}" class="${i === (audioIdx < 0 ? 0 : audioIdx) ? 'active' : ''}" aria-pressed="${i === (audioIdx < 0 ? 0 : audioIdx)}">Ch ${a.chapter}</button>`).join('');
      // Downloads are gated on real availability — only chapters in audioQueue exist.
      // Both actions are folded into ONE compact download button opening a small menu.
      dlToggle.style.display = '';
      dlBtn.style.display = '';
      dlAllBtn.style.display = audioQueue.length > 1 ? '' : 'none';
    } else {
      playBtn.innerHTML = ICON_PLAY;
      noteEl.textContent = 'Not yet available — narration is being generated by VerseWell';
      chapRow.style.display = 'none';
      dlToggle.style.display = 'none';
      dlMenu.hidden = true;
    }
  }

  async function loadAudio() {
    // One request-time check per passage load (server caches short-TTL); no polling.
    // A day can span multiple books: query availability for EVERY assignment
    // range, not just the first, so the queue covers all of today's chapters.
    const translation = sel.value;
    audioQueue = [];
    audioIdx = -1;
    pendingSeek = null;
    audioEl.pause();
    audioEl.removeAttribute('src');
    syncSeekUi();
    for (const a of day.assignments) {
      const { data } = await FH.api(`/api/read/audio_availability?book=${encodeURIComponent(a.book)}&chapter_start=${a.chapter_start}&chapter_end=${a.chapter_end}&translation=${encodeURIComponent(translation)}`);
      if (data && Array.isArray(data.available))
        for (const av of data.available)
          audioQueue.push({ book: a.book, chapter: av.chapter, url: av.url,
            // PLAYBACK goes through the same-origin proxy: VerseWell's static
            // host does not honour HTTP Range requests, so playing the file
            // directly made every seek restart from 0. The proxy answers with
            // Accept-Ranges + proper 206 handling. Downloads still use the
            // direct url (full-file fetch works fine cross-origin).
            playUrl: '/api/read/audio_proxy?book=' + encodeURIComponent(a.book) +
              '&chapter=' + av.chapter + '&translation=' + encodeURIComponent(translation) });
    }
    setAudioState();
  }

  function playIdx(i) {
    if (i < 0 || i >= audioQueue.length) return;
    audioIdx = i;
    audioEl.preload = 'auto';
    audioEl.src = audioQueue[i].playUrl || audioQueue[i].url;
    audioEl.play().catch(() => {});
    playBtn.innerHTML = ICON_PAUSE;
    noteEl.textContent = `Playing ${audioQueue[i].book} ${audioQueue[i].chapter}`;
    // Keep the verse pane on the chapter being narrated (auto-advance support).
    // Match by book+chapter, not by index: partial audio availability means the
    // audio queue can be a SUBSET of the day's chapter list (e.g. only ch 2 of
    // 1-3 narrated), so audioIdx does not necessarily equal the chapter index.
    const aq = audioQueue[i];
    const ci = chapterList.findIndex(c => c.book === aq.book && c.chapter === aq.chapter);
    if (ci >= 0 && ci !== chapterIdx) renderChapter(ci);
    chapRow.querySelectorAll('button').forEach((b, j) => {
      b.classList.toggle('active', j === i);
      b.setAttribute('aria-pressed', j === i ? 'true' : 'false');
    });
  }

  playBtn.onclick = () => {
    if (!audioQueue.length) return;
    if (audioEl.paused) {
      if (audioIdx < 0) playIdx(0);
      else { audioEl.play().catch(() => {}); playBtn.innerHTML = ICON_PAUSE; }
    } else {
      audioEl.pause();
      playBtn.innerHTML = ICON_PLAY;
    }
  };
  // ±5-second skips via the native element's currentTime (clamped to bounds).
  function skip(delta) {
    if (!audioQueue.length) return;
    if (audioIdx < 0) { pendingSeek = 0; playIdx(0); return; }
    if (isFinite(audioEl.duration) && audioEl.duration > 0) {
      audioEl.currentTime = Math.min(Math.max(0, audioEl.currentTime + delta), Math.max(0, audioEl.duration - 0.1));
    } else {
      // Metadata not loaded yet — changing currentTime now would be dropped
      // (and looked like a restart-from-0). Queue the skip; it applies the
      // moment loadedmetadata/durationchange reports a real duration.
      pendingSeek = Math.max(0, (pendingSeek ?? audioEl.currentTime ?? 0) + delta);
    }
  }
  backBtn.onclick = () => skip(-5);
  fwdBtn.onclick = () => skip(5);
  // Scrubber: live preview while dragging, seek on release; also seeks on tap.
  seekEl.addEventListener('pointerdown', () => { seeking = true; });
  seekEl.addEventListener('input', () => {
    const d = audioEl.duration;
    if (d) curEl.textContent = fmtSecs(d * seekEl.value / 1000);
  });
  seekEl.addEventListener('change', () => {
    if (!audioQueue.length) { seeking = false; return; }
    const d = audioEl.duration;
    if (isFinite(d) && d > 0) {
      pendingSeek = null;
      audioEl.currentTime = d * seekEl.value / 1000;
    } else {
      // Chapter never started (duration unknown): buffer WITHOUT autoplaying
      // from 0, then jump to the tapped proportional position as soon as the
      // duration arrives. Never call playIdx() here — it would reset the src
      // and restart the stream from the beginning.
      audioEl.preload = 'auto';
      pendingSeek = 'ratio:' + (seekEl.value / 1000);
      if (audioIdx < 0) { audioIdx = 0; audioEl.src = audioQueue[0].playUrl || audioQueue[0].url; }
    }
    seeking = false;
    syncSeekUi();
  });
  chapRow.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-ai]');
    if (b) playIdx(parseInt(b.dataset.ai, 10));
  });
  audioEl.addEventListener('timeupdate', syncSeekUi);

  // ── Time-estimated auto-scroll synced to audio (task-i06) ────────────────
  // VerseWell audio has NO word/verse timing data, so precise sync is
  // impossible. Instead the pane scrolls at the audio's proportional pace:
  //   scrollTop = (currentTime / duration) * scrollableHeight
  // recalculated every animation frame from the LIVE currentTime, so it stays
  // correct through seeks, buffering and stalls. Audio-driven only — it never
  // runs while paused. Manual scrolling pauses it until resumed.
  const passageEl = document.getElementById('passage');
  const asResumeBtn = document.getElementById('autoscroll-resume');
  let autoScrollEnabled = true;
  let asRaf = 0;
  let lastAppliedTop = 0;
  function asScrollable() { return Math.max(0, passageEl.scrollHeight - passageEl.clientHeight); }
  function autoScrollFrame() {
    asRaf = 0;
    if (audioEl.paused || audioEl.ended) return;         // audio-driven only
    const d = audioEl.duration;
    if (!isFinite(d) || d <= 0) { asRaf = requestAnimationFrame(autoScrollFrame); return; }
    if (autoScrollEnabled) {
      const max = asScrollable();
      const target = Math.min(max, (audioEl.currentTime / d) * max);
      if (Math.abs(target - lastAppliedTop) > 0.5) { passageEl.scrollTop = target; lastAppliedTop = target; }
      asResumeBtn.hidden = true;
    }
    asRaf = requestAnimationFrame(autoScrollFrame);
  }
  function asStart() { if (!asRaf) asRaf = requestAnimationFrame(autoScrollFrame); }
  window.__fhAutoScrollReset = function () {
    autoScrollEnabled = true; asResumeBtn.hidden = true; lastAppliedTop = 0;
  };
  // User scrolled manually while playing -> stop fighting them, offer resume.
  passageEl.addEventListener('scroll', () => {
    if (audioEl.paused || audioEl.ended || !autoScrollEnabled) return;
    const d = audioEl.duration;
    if (!isFinite(d) || d <= 0) return;
    const expected = Math.min(asScrollable(), (audioEl.currentTime / d) * asScrollable());
    if (Math.abs(passageEl.scrollTop - expected) > 30) {   // a real manual deviation
      autoScrollEnabled = false;
      asResumeBtn.hidden = false;
    }
  }, { passive: true });
  asResumeBtn.onclick = () => { autoScrollEnabled = true; asResumeBtn.hidden = true; lastAppliedTop = -1; };
  audioEl.addEventListener('play', asStart);
  audioEl.addEventListener('seeked', () => { lastAppliedTop = -1; }); // resync after a seek
  // Apply any queued seek only once real metadata (a finite duration) exists.
  function applyPendingSeek() {
    if (pendingSeek != null && isFinite(audioEl.duration) && audioEl.duration > 0) {
      const t = (typeof pendingSeek === 'string' && pendingSeek.startsWith('ratio:'))
        ? parseFloat(pendingSeek.slice(6)) * audioEl.duration
        : pendingSeek;
      audioEl.currentTime = Math.min(Math.max(0, t), Math.max(0, audioEl.duration - 0.1));
      pendingSeek = null;
    }
    syncSeekUi();
  }
  audioEl.addEventListener('loadedmetadata', applyPendingSeek);
  audioEl.addEventListener('durationchange', applyPendingSeek);
  audioEl.addEventListener('ended', () => {
    // Auto-advance to the next chapter (task-i07) — but only into the
    // IMMEDIATELY FOLLOWING text chapter, and only when that chapter's audio
    // genuinely exists. If the next chapter's audio is not yet available
    // (progressive availability), stop cleanly: never skip ahead to a later
    // chapter that has audio while leaving a gap, and never advance into a
    // silent/broken state. The manual Next Chapter button stays the way forward.
    const cur = audioQueue[audioIdx];
    const curCi = cur ? chapterList.findIndex(c => c.book === cur.book && c.chapter === cur.chapter) : -1;
    const nextCi = curCi + 1;
    if (curCi >= 0 && nextCi < chapterList.length) {
      const nc = chapterList[nextCi];
      const ni = audioQueue.findIndex(a => a.book === nc.book && a.chapter === nc.chapter);
      if (ni >= 0) { playIdx(ni); return; }  // renders new chapter text + resets auto-scroll via renderChapter
    }
    playBtn.innerHTML = ICON_PLAY;
    syncSeekUi();
    doneBtn.style.display = '';
  });

  // Download menu: one compact button opens a small menu holding BOTH download
  // actions (task-i04) — they no longer each occupy a full stacked row.
  dlToggle.onclick = (e) => { e.stopPropagation(); dlMenu.hidden = !dlMenu.hidden; };
  document.addEventListener('click', (e) => {
    if (!dlMenu.hidden && !dlMenu.contains(e.target) && e.target !== dlToggle) dlMenu.hidden = true;
  });

  // ----- Audio downloads (blob fetch — VerseWell sends ACAO:* so cross-origin
  // works — then an object-URL anchor with a real filename; sequential for the
  // multi-file "today" variant, which browsers allow from one user gesture). ----
  function audioFileName(a) {
    const book = a.book ? a.book.replace(/\s+/g, '-') + '-' : '';
    return `ForgeHouse50-Day${dayN}-${book}Ch${a.chapter}.m4a`;
  }
  async function downloadOneAudio(a) {
    const res = await fetch(a.url);
    if (!res.ok) throw new Error('fetch failed');
    const blob = await res.blob();
    const obj = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = obj;
    link.download = audioFileName(a);
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(obj), 10000);
  }
  dlBtn.onclick = async () => {
    const a = audioQueue[audioIdx >= 0 ? audioIdx : 0];
    if (!a) return;
    dlBtn.disabled = true;
    dlBtn.textContent = 'Downloading…';
    try { await downloadOneAudio(a); }
    catch { noteEl.textContent = 'Download failed — please try again'; }
    dlBtn.innerHTML = FH.ICONS.download + '<span>Download this chapter</span>';
    dlBtn.disabled = false;
  };
  dlAllBtn.onclick = async () => {
    if (!audioQueue.length) return;
    dlAllBtn.disabled = true;
    for (let i = 0; i < audioQueue.length; i++) {
      dlAllBtn.textContent = `Downloading ${i + 1}/${audioQueue.length}…`;
      try { await downloadOneAudio(audioQueue[i]); } catch { /* continue with the rest */ }
    }
    dlAllBtn.innerHTML = FH.ICONS.download + '<span>Download all for today</span>';
    dlAllBtn.disabled = false;
  };
  doneBtn.onclick = async () => {
    await FH.api('/api/read/audio', { method: 'POST', body: { day_number: dayN } });
    doneBtn.innerHTML = FH.ICONS.check + '<span>Audio complete</span>';
    doneBtn.disabled = true;
  };

  await loadHighlights();
  await loadPassage();
  sel.addEventListener('change', loadPassage);

  // Tap a verse to highlight (cycles amber -> none) — simple, mobile-friendly
  document.getElementById('passage').addEventListener('click', async (e) => {
    if (e.target.closest('.fn-marker')) return; // footnote taps handled above
    const p = e.target.closest('p.v');
    if (!p) return;
    const ch = parseInt(p.dataset.ch, 10), v = parseInt(p.dataset.v, 10);
    const book = p.dataset.book || day.assignments[0].book;
    const existing = highlights.find(h => h.chapter === ch && v >= h.verse_start && v <= h.verse_end);
    if (existing) {
      await FH.api('/api/read/highlight', { method: 'DELETE', body: { id: existing.id } });
      highlights = highlights.filter(h => h.id !== existing.id);
      p.className = 'v';
    } else {
      await FH.api('/api/read/highlight', { method: 'POST', body: { book, chapter: ch, verse_start: v, verse_end: v, color: 'amber' } });
      highlights.push({ chapter: ch, verse_start: v, verse_end: v, color: 'amber' });
      p.className = 'v hl-amber';
    }
  });

  // Font size
  const sizes = ['fs-small', 'fs-medium', 'fs-large'];
  let fsIdx = +(localStorage.getItem('fh50_fs') ?? 1);
  function applyFs() {
    const el = document.getElementById('passage');
    el.classList.remove(...sizes); el.classList.add(sizes[fsIdx]);
    localStorage.setItem('fh50_fs', fsIdx);
  }
  applyFs();
  document.getElementById('fs-dec').onclick = () => { fsIdx = Math.max(0, fsIdx - 1); applyFs(); };
  document.getElementById('fs-inc').onclick = () => { fsIdx = Math.min(sizes.length - 1, fsIdx + 1); applyFs(); };

  // Bookmark (first verse of passage)
  document.getElementById('bookmark-btn').onclick = async () => {
    const a = day.assignments[0];
    await FH.api('/api/read/bookmark', { method: 'POST', body: { book: a.book, chapter: a.chapter_start, day_number: dayN } });
    const bb = document.getElementById('bookmark-btn');
    bb.innerHTML = FH.ICONS.check + '<span>Saved</span>';
  };

  // Reading-time heartbeat (30s)
  setInterval(() => {
    if (document.visibilityState === 'visible')
      FH.api('/api/read/time', { method: 'POST', body: { day_number: dayN, seconds: 30 } });
  }, 30000);

  // Mark complete — a SLIM inline strip, not a stacked card (task-i05). The
  // completion card + write-a-note used to add a large block that forced the
  // page itself to scroll; now it is one slim row that never does.
  function renderMarkArea() {
    const done = !!day.progress.completed;
    document.getElementById('mark-area').innerHTML = done
      ? `<div class="mark-strip done-strip">
           <span class="check">${FH.ICONS.check}<span>Reading complete</span></span>
           <a class="btn ghost small" style="width:auto" href="/notes?day=${dayN}&book=${encodeURIComponent(day.assignments[0].book)}&chapter=${day.assignments[0].chapter_start}">Write a note</a>
         </div>`
      : `<div class="mark-strip"><button class="btn small" id="mark-btn">Mark Complete · Day ${dayN}</button></div>`;
    if (!done) document.getElementById('mark-btn').onclick = async () => {
      const btn = document.getElementById('mark-btn'); btn.disabled = true;
      const { ok, data } = await FH.api('/api/read/complete', { method: 'POST', body: { day_number: dayN } });
      if (ok) { day.progress.completed = 1; renderMarkArea(); }
      else { btn.disabled = false; }
    };
  }
  renderMarkArea();
  // (Day-to-day Previous/Next navigation moved into the header overflow menu —
  //  see the rd-top render above — so it no longer adds a stacked page block.)
})();
</script>
</body>
<script>FH.nav('read')</script>
</html>
