<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ForgeHouse 50 — Notes</title>
<link rel="stylesheet" href="/app.css">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#f4f7fc">
<link rel="icon" href="/icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ForgeHouse 50">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
</head>
<body>
<div class="wrap">
  <div id="top"></div>
  <main>
    <!-- New note editor -->
    <section class="card" aria-labelledby="new-note-h">
      <h3 id="new-note-h">New note</h3>
      <p class="small muted" style="margin-top:2px">Private to you. Never shown on the leaderboard or to admins.</p>

      <div class="field" style="margin-top:var(--s-4)">
        <label id="type-label">Note type</label>
        <div class="type-grid" id="n-type-grid" role="radiogroup" aria-labelledby="type-label"></div>
        <!-- Canonical value posted as note_type; kept in sync with the tiles. -->
        <select id="n-type" class="sr-only" tabindex="-1" aria-hidden="true">
          <option value="observation">Observation</option>
          <option value="question">Question</option>
          <option value="scripture_connection">Scripture Connection</option>
          <option value="application">Application</option>
          <option value="prayer">Prayer</option>
        </select>
      </div>

      <div class="grid2">
        <div class="field"><label for="n-book">Book</label>
          <input id="n-book" placeholder="e.g. John"></div>
        <div class="field"><label for="n-chapter">Chapter</label>
          <input id="n-chapter" type="number" min="1" placeholder="1"></div>
      </div>
      <div class="grid2">
        <div class="field"><label for="n-verse">Verse <span class="muted">(optional)</span></label>
          <input id="n-verse" type="number" min="1" placeholder="—"></div>
        <div class="field"><label for="n-day">Reading day <span class="muted">(optional)</span></label>
          <input id="n-day" type="number" min="1" max="50" placeholder="—"></div>
      </div>
      <div class="field">
        <label for="n-body">Your note</label>
        <textarea id="n-body" rows="4" placeholder="What did you notice, question, or want to apply?"></textarea>
      </div>
      <div class="error" id="n-err"></div>
      <button class="btn" id="n-save">Save note</button>
    </section>

    <!-- Search + filter -->
    <section aria-label="Search and filter notes">
      <div class="section-title"><h2>My notes</h2><span class="small muted" id="n-count"></span></div>
      <div class="row wrap" style="gap:var(--s-2)">
        <label for="q" class="sr-only">Search your notes</label>
        <input id="q" class="input-sm" placeholder="Search your notes…" style="flex:2;min-width:150px">
        <label for="f-type" class="sr-only">Filter by type</label>
        <select id="f-type" class="input-sm" style="flex:1;min-width:130px">
          <option value="">All types</option>
          <option value="observation">Observations</option>
          <option value="question">Questions</option>
          <option value="scripture_connection">Scripture Connections</option>
          <option value="application">Applications</option>
          <option value="prayer">Prayers</option>
        </select>
      </div>
    </section>

    <section id="list" aria-live="polite"></section>
  </main>
</div>
<script src="/app.js"></script>
<script>FH.nav('notes');</script>
<script src="/js/notes.js"></script>
</body>
</html>
