<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ForgeHouse 50 — Verify email</title>
<link rel="stylesheet" href="/app.css">
<link rel="manifest" href="/manifest.webmanifest">
<!-- Theme is automatic (prefers-color-scheme). This tag is only the browser-chrome
     colour and is kept in sync by FH.initTheme(); there is no theme setting. -->
<meta name="theme-color" content="#f4f7fc">
<link rel="icon" href="/icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ForgeHouse 50">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
</head>
<body class="auth">
<main class="auth-wrap">
  <div id="head"></div>
  <section class="auth-card rise">
    <h1 style="margin-bottom:var(--s-2)">Check your email</h1>
    <p class="small muted" style="margin-bottom:var(--s-5)">
      We sent a 6-digit verification code to
      <strong class="verify-email" id="em"></strong>. It expires in 10 minutes.</p>

    <form id="verify-form" novalidate>
      <div class="field">
        <label for="code">Verification code</label>
        <input type="text" id="code" name="code" class="otp-input" inputmode="numeric"
               pattern="\d{6}" maxlength="6" required placeholder="••••••"
               autocomplete="one-time-code" autocapitalize="off" spellcheck="false"
               aria-describedby="code-help">
        <p class="tiny muted" id="code-help" style="margin:8px 0 0;text-align:center">
          Six digits, from the email we just sent.</p>
      </div>

      <div class="error" id="err" role="alert"></div>
      <div class="ok-msg" id="ok" role="status"></div>
      <button class="btn" type="submit" id="submit-btn">Verify &amp; continue</button>
    </form>

    <p class="auth-foot">
      Didn't get it?
      <a href="#" id="resend">Send a new code</a>
    </p>
    <p class="auth-foot" style="margin-top:var(--s-2)">
      Wrong address? <a href="/signup.html">Start again</a>
    </p>
  </section>
</main>
<script src="/app.js"></script>
<script src="/js/verify.js"></script>
<script src="https://www.genspark.ai/sandbox_inspect.js"></script></body>
</html>
