<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ForgeHouse 50 — Day Quiz</title>
<link rel="stylesheet" href="/app.v12.css">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0f1216">
<link rel="icon" href="/icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ForgeHouse 50">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
</head>
<body>
<div class="wrap">
  <div id="top"></div>
  <div id="quiz"></div>
</div>
<script src="/app.v7.js"></script>
<script>
// quiz_redesign_and_launch_wipe_v1 / task-w05 — the quiz is INFORMATIONAL:
// one attempt per reading day, the result is always shown immediately, and it
// NEVER blocks completing the reading day. Day completion + its points live
// at POST /api/read/complete (the pre-quiz-gate "Mark Complete" trigger).
(async () => {
  const me = await FH.requireAuth();
  if (!me) return;

  const dayN = parseInt(new URLSearchParams(location.search).get('day') || '0', 10);
  if (!dayN || dayN < 1 || dayN > 50) { location.href = '/read'; return; }

  document.getElementById('top').innerHTML = FH.topbar(`Reading Day ${dayN} Quiz`);
  const box = document.getElementById('quiz');

  const { ok, data } = await FH.api(`/api/quiz/${dayN}`);
  if (!ok || !data) {
    box.innerHTML = `<div class="card"><p class="muted">${FH.esc(data?.error || 'Could not load the quiz.')}</p>
      <a class="btn ghost" href="/read?day=${dayN}">Back to reading</a></div>`;
    return;
  }

  const INFO_NOTE = `This quiz helps track your understanding — it won't stop you from continuing. One attempt only, and your score earns up to ${data.quiz_points_possible} bonus points, proportional to how many you get right.`;

  // Completion is independent of the quiz — offer it whenever the day is open.
  function completeButton() {
    return data.completed
      ? `<p class="muted small" style="margin-top:10px">Day ${dayN} reading is complete.</p>`
      : `<button class="btn" id="mark-complete" style="margin-top:12px">Mark Day ${dayN} reading complete</button>`;
  }
  function wireComplete() {
    const mc = document.getElementById('mark-complete');
    if (!mc) return;
    mc.onclick = async () => {
      mc.disabled = true; mc.textContent = 'Marking…';
      const r = await FH.api('/api/read/complete', { method: 'POST', body: { day_number: dayN } });
      if (r.ok) {
        data.completed = true;
        mc.outerHTML = `<p class="muted small" style="margin-top:10px">Day ${dayN} reading complete${r.data?.points_awarded ? ` · +${r.data.points_awarded} pts` : ''}.</p>`;
      } else {
        mc.disabled = false; mc.textContent = r.data?.error || 'Could not mark complete — try again';
      }
    };
  }

  // The single attempt was already used — show the final result, no retake.
  if (data.attempt) {
    box.innerHTML = `<div class="card center">
      <span class="pill">Day ${dayN} · final</span>
      <h2 style="margin:10px 0 4px">You scored ${data.attempt.score} out of ${data.attempt.total}</h2>
      <p class="muted small">One attempt per reading day — no retakes.${data.completed ? '' : ' You can still mark today\'s reading complete below — the quiz never blocks it.'}</p>
      ${completeButton()}
      <div class="row" style="margin-top:10px">
        <a class="btn ghost small" style="flex:1" href="/read?day=${dayN}">Back to reading</a>
        <a class="btn ghost small" style="flex:1" href="/progress">Progress</a>
      </div></div>`;
    wireComplete();
    return;
  }

  if (!data.can_attempt) {
    const msgs = {
      attempt_used: 'You have already taken this quiz — one attempt per reading day.',
      previous_day_incomplete: `Finish Day ${dayN - 1} first — reading days are taken in order.`,
      read_ahead_limit: 'You can only read one day ahead — come back tomorrow to continue.',
    };
    box.innerHTML = `<div class="card center">
      <span class="pill gray">Day ${dayN}</span>
      <h2 style="margin:10px 0 4px">Not yet</h2>
      <p class="muted small">${FH.esc(msgs[data.block_reason] || 'This quiz is not available yet.')}</p>
      <a class="btn ghost small" href="/read?day=${Math.max(1, dayN - 1)}">Back to reading</a></div>`;
    return;
  }

  // Main quiz form — one scrollable card, tap-to-select, single final submit.
  const chosen = new Array(data.questions.length).fill(null);

  function render() {
    const answered = chosen.filter(c => c !== null).length;
    box.innerHTML = `<div class="card">
      <div class="between small muted"><span class="pill">Day ${data.day_number} Quiz</span><span>one attempt</span></div>
      <p class="small muted" style="margin:8px 0 14px">${FH.esc(INFO_NOTE)}</p>
      ${data.questions.map((q, qi) => `
        <div class="quiz-q">
          <div class="quiz-qt">${qi + 1}. ${FH.esc(q.q)}</div>
          ${q.options.map((opt, oi) => `
            <button type="button" class="quiz-opt ${chosen[qi] === oi ? 'sel' : ''}" data-q="${qi}" data-o="${oi}">${FH.esc(opt)}</button>`).join('')}
        </div>`).join('')}
      <div id="quiz-msg"></div>
      <button class="btn" id="quiz-submit" ${answered < data.questions.length ? 'disabled' : ''}>Submit final answers (${answered}/${data.questions.length})</button>
    </div>`;

    box.querySelectorAll('.quiz-opt').forEach(b => b.onclick = () => {
      chosen[+b.dataset.q] = +b.dataset.o;
      render();
    });

    const sub = document.getElementById('quiz-submit');
    sub.onclick = async () => {
      sub.disabled = true;
      sub.textContent = 'Submitting…';
      const r = await FH.api('/api/quiz/submit', { method: 'POST', body: { day_number: dayN, answers: chosen } });
      if (r.ok && r.data) {
        // The result is ALWAYS shown immediately, whatever the score.
        box.innerHTML = `<div class="card center">
          <span class="pill">Day ${dayN} · final</span>
          <h2 style="margin:10px 0 4px">You scored ${r.data.score} out of ${r.data.total}</h2>
          <p class="muted small">+${r.data.quiz_points} quiz points. ${FH.esc(r.data.message || '')}</p>
          ${completeButton()}
          <div class="row" style="margin-top:10px">
            <a class="btn ghost small" style="flex:1" href="/read?day=${dayN}">Back to reading</a>
            <a class="btn ghost small" style="flex:1" href="/progress">Progress</a>
          </div></div>`;
        wireComplete();
        return;
      }
      const msg = document.getElementById('quiz-msg');
      msg.innerHTML = `<div class="quiz-fail small">${FH.esc(r.data?.error || 'Something went wrong — please try again.')}</div>`;
      sub.disabled = false;
      sub.textContent = 'Submit final answers';
    };
  }
  render();
})();
</script>
</body>
<script>FH.nav('read')</script>
</html>
