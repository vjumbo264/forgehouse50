<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ForgeHouse 50 — Profile</title>
<link rel="stylesheet" href="/app.v3.css">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0f1216">
<link rel="icon" href="/icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ForgeHouse 50">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
</head>
<body>
<div class="wrap">
  <div id="top"></div>
  <div id="identity"></div>
  <div id="avatar-settings"></div>
  <div id="stats"></div>
  <div id="badges"></div>
  <div id="all-badges"></div>
  <div id="admin-link"></div>
  <button class="btn ghost" id="logout">Log out</button>
</div>
<script src="/app.v3.js"></script>
<script>
(async () => {
  const me = await FH.requireAuth();
  if (!me) return;
  document.getElementById('top').innerHTML = FH.topbar('Profile');
  const s = me.stats;

  document.getElementById('identity').innerHTML = `
    <div class="card row">
      ${FH.avatarHtml(me.avatar_id, me.name || me.email, 56)}
      <div><h1 style="margin:0">${FH.esc(me.name || 'Member')}</h1>
      <div class="small muted">${FH.esc(me.email)}${me.role === 'admin' ? ' · <span class="pill">admin</span>' : ''}</div></div>
    </div>`;

  // Avatar settings — changeable at any time from the same preset set,
  // persisted to D1 immediately. (This is the only profile-editing control;
  // email/password/name stay read-only per scope.)
  let myAvatar = me.avatar_id || FH.AVATARS[0].id;
  const settings = document.getElementById('avatar-settings');
  settings.innerHTML = `<div class="card">
    <h2 style="margin-top:0">Your avatar</h2>
    <div class="avatar-picker" id="me-avatar-picker"></div>
    <div class="small muted" id="avatar-msg" style="margin-top:8px"></div>
  </div>`;
  const mePicker = document.getElementById('me-avatar-picker');
  mePicker.innerHTML = FH.AVATARS.map(a =>
    `<button type="button" data-avatar="${a.id}" class="${a.id === myAvatar ? 'selected' : ''}" title="${a.label}">${FH.avatarHtml(a.id, '', 44)}</button>`).join('');
  mePicker.addEventListener('click', async (e) => {
    const b = e.target.closest('button[data-avatar]');
    if (!b || b.dataset.avatar === myAvatar) return;
    myAvatar = b.dataset.avatar;
    mePicker.querySelectorAll('button').forEach(x => x.classList.toggle('selected', x.dataset.avatar === myAvatar));
    const msg = document.getElementById('avatar-msg');
    const { ok } = await FH.api('/api/auth/avatar', { method: 'POST', body: { avatar_id: myAvatar } });
    msg.textContent = ok ? 'Saved ✓' : 'Could not save — try again';
    if (ok) {
      document.getElementById('identity').querySelector('.avatar').outerHTML = FH.avatarHtml(myAvatar, me.name || me.email, 56);
      setTimeout(() => { msg.textContent = ''; }, 2000);
    }
  });

  const pct = Math.min(100, Math.round(s.days_completed / 50 * 100));
  document.getElementById('stats').innerHTML = `
    <div class="card">
      <div class="between small muted"><span>Programme progress</span><span>${s.days_completed}/50 days</span></div>
      <div class="bar" style="margin:8px 0 12px"><i style="width:${pct}%"></i></div>
      <div class="grid3">
        <div class="stat"><div class="v">${s.points}</div><div class="l">Points</div></div>
        <div class="stat"><div class="v">${s.streak_current}</div><div class="l">Streak</div></div>
        <div class="stat"><div class="v">${s.chapters}</div><div class="l">Chapters</div></div>
      </div>
      <div class="grid3" style="margin-top:10px">
        <div class="stat"><div class="v">${FH.fmtTime(s.reading_seconds)}</div><div class="l">Reading time</div></div>
        <div class="stat"><div class="v">${s.observations}</div><div class="l">Observations</div></div>
        <div class="stat"><div class="v">${s.questions}</div><div class="l">Questions</div></div>
      </div>
    </div>`;

  const CATALOGUE = [
    ['streak-7', '7-Day Streak'], ['streak-14', '14-Day Streak'], ['streak-25', '25-Day Streak'],
    ['finisher-50', '50-Day Finisher'], ['chapters-100', '100 Chapters'], ['chapters-200', '200 Chapters'],
    ['chapters-260', '260 Chapters'], ['audio-50', '50 Audio Sessions'],
    ['observations-25', '25 Observations'], ['questions-25', '25 Questions'],
  ];
  const earned = new Set((me.badges || []).map(b => b.id));
  document.getElementById('badges').innerHTML = `<h2>Badges <span class="small muted">(${earned.size}/${CATALOGUE.length})</span></h2>
    <div>${CATALOGUE.map(([id, name]) => `<span class="badge ${earned.has(id) ? 'earned' : ''}">${earned.has(id) ? '★' : '☆'} ${name}</span>`).join('')}</div>`;

  if (me.role === 'admin') {
    document.getElementById('admin-link').innerHTML = `<a class="btn ghost" style="margin:10px 0" href="/admin.html">Admin dashboard →</a>`;
  }

  document.getElementById('logout').onclick = async () => {
    await FH.api('/api/auth/logout', { method: 'POST' });
    location.href = '/login.html';
  };
})();
</script>
</body>
<script>FH.nav('profile')</script>
</html>
