<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ForgeHouse 50 — Admin</title>
<link rel="stylesheet" href="/app.css">
<link rel="manifest" href="/manifest.webmanifest">
<!-- Theme is automatic (prefers-color-scheme). This tag is only the browser-chrome
     colour and is kept in sync by FH.initTheme(); there is no theme setting. -->
<meta name="theme-color" content="#f4f7fc">
<link rel="icon" href="/icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ForgeHouse 50">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
</head>
<body>
<div class="wrap">
  <div id="top"></div>

  <!-- Non-admin / unauthenticated notice lands here -->
  <div id="gate"></div>

  <main id="admin-main" hidden>
    <!-- Programme-wide KPIs -->
    <section class="rise" aria-labelledby="overview-h">
      <h2 id="overview-h">Programme overview</h2>
      <div id="stats"></div>
    </section>

    <!-- Participant roster + per-member actions -->
    <section class="rise rise-1" aria-labelledby="participants-h">
      <div class="between" style="margin-top:var(--s-6)">
        <h2 id="participants-h" style="margin:0">Participants</h2>
        <span class="pill gray" id="participant-count"></span>
      </div>
      <div class="field" style="margin-top:var(--s-3)">
        <label for="participant-search" class="sr-only">Filter participants</label>
        <input type="search" id="participant-search" class="input-sm"
               placeholder="Filter by name or email" autocapitalize="off" spellcheck="false">
      </div>
      <div id="participants"></div>
    </section>

    <!-- Reading-assignment editor -->
    <section class="rise rise-2" aria-labelledby="assignment-h">
      <h2 id="assignment-h" style="margin-top:var(--s-6)">Reading assignment</h2>
      <div class="card">
        <p class="small muted" style="margin-top:0">
          Replace the chapters mapped to one of the 50 reading days. This overwrites
          that day's assignment for every participant.</p>

        <div class="control-row">
          <div style="flex:0 0 84px">
            <label for="as-day">Day</label>
            <input id="as-day" type="number" min="1" max="50" placeholder="1" class="input-sm">
          </div>
          <div style="flex:1 1 150px">
            <label for="as-book">Book</label>
            <input id="as-book" type="text" placeholder="Matthew" class="input-sm">
          </div>
          <div style="flex:0 0 84px">
            <label for="as-cs">From ch.</label>
            <input id="as-cs" type="number" min="1" placeholder="1" class="input-sm">
          </div>
          <div style="flex:0 0 84px">
            <label for="as-ce">To ch.</label>
            <input id="as-ce" type="number" min="1" placeholder="6" class="input-sm">
          </div>
        </div>

        <div class="error" id="as-err" role="alert"></div>
        <div class="ok-msg" id="as-ok" role="status"></div>
        <button class="btn" id="as-save" style="margin-top:var(--s-3)">Replace day assignment</button>
      </div>
    </section>

    <p class="tiny muted center" style="margin:var(--s-6) 0 0">
      Participants' note contents are private and are never shown here — only
      aggregate counts.</p>
  </main>
</div>
<script src="/app.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
