<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ForgeHouse 50 — Create account</title>
<link rel="stylesheet" href="/app.css">
<link rel="manifest" href="/manifest.webmanifest">
<!-- Theme is automatic (prefers-color-scheme); this is browser chrome only. -->
<meta name="theme-color" content="#f4f7fc">
<link rel="icon" href="/icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ForgeHouse 50">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
</head>
<body class="auth">
<main class="auth-wrap">
  <div id="head"></div>
  <section class="auth-card rise">
    <h1 style="margin-bottom:var(--s-2)">Create your account</h1>
    <p class="small muted" style="margin-bottom:var(--s-5)">
      We'll email you a 6-digit code to confirm it's you. It expires in 10 minutes.</p>

    <form id="signup-form" novalidate>
      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" autocomplete="name" placeholder="Your name">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email"
               inputmode="email" autocapitalize="off" spellcheck="false"
               placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required minlength="8"
               autocomplete="new-password" placeholder="At least 8 characters">
        <p class="tiny muted" style="margin:6px 0 0">Minimum 8 characters.</p>
      </div>

      <div class="field">
        <label id="avatar-label">Choose your avatar
          <span class="muted">(optional — change it any time)</span></label>
        <div class="avatar-picker" id="avatar-picker" role="radiogroup"
             aria-labelledby="avatar-label"></div>
      </div>

      <div class="error" id="err" role="alert"></div>
      <button class="btn" type="submit" id="submit-btn">Create account</button>
    </form>

    <p class="auth-foot">Already have an account? <a href="/login.html">Log in</a></p>
  </section>
</main>
<script src="/app.js"></script>
<script src="/js/signup.js"></script>
</body>
</html>
